name: ECU definition audit

on:
  workflow_dispatch:
  push:
    branches: [main, "project/**"]
    paths:
      - "**.xml"
      - "**.xdf"
      - "**.kp"
      - "**.a2l"
      - "**.bin"
      - "**.rom"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/definition-audit.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit tracked workspace
        run: python tools/definition_audit.py --root . --out build/definition-audit
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecu-definition-audit
          path: build/definition-audit/
          if-no-files-found: warn
          retention-days: 30
